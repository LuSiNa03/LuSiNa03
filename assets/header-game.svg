<svg viewBox="0 0 900 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .frame { fill: none; stroke: #39FF14; stroke-width: 4; }
      .corner { fill: #39FF14; animation: blinkCorner 1s steps(1) infinite; }
      .title { font-family: 'Courier New', monospace; font-weight: bold; font-size: 40px; fill: #39FF14; }
      .cursor { fill: #39FF14; animation: blinkCursor 0.8s steps(1) infinite; }
      .sub { font-family: 'Courier New', monospace; font-size: 16px; fill: #FFD700; animation: blinkCursor 1.2s steps(1) infinite; }
      .barBg { fill: #161b22; stroke: #39FF14; stroke-width: 2; }
      .barFill { fill: #39FF14; animation: loadBar 3s ease-in-out infinite; }
      .scan { fill: #39FF14; opacity: 0.06; animation: scanMove 4s linear infinite; }

      @keyframes blinkCorner { 0%,49% { opacity: 1; } 50%,100% { opacity: 0.15; } }
      @keyframes blinkCursor { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
      @keyframes loadBar {
        0% { width: 0px; }
        45% { width: 480px; }
        55% { width: 480px; }
        100% { width: 0px; }
      }
      @keyframes scanMove {
        0% { transform: translateY(0); }
        100% { transform: translateY(160px); }
      }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="900" height="160" rx="6"/>
  <rect class="frame" x="4" y="4" width="892" height="152" rx="4"/>

  <rect class="corner" x="10" y="10" width="10" height="10"/>
  <rect class="corner" x="880" y="10" width="10" height="10"/>
  <rect class="corner" x="10" y="140" width="10" height="10"/>
  <rect class="corner" x="880" y="140" width="10" height="10"/>

  <rect class="scan" x="0" y="0" width="900" height="20"/>

  <text x="60" y="70" class="title">LuSiNa03</text>
  <rect class="cursor" x="335" y="42" width="16" height="34"/>

  <text x="60" y="100" class="sub">&gt; PRESS START TO LOAD PROFILE_</text>

  <rect class="barBg" x="60" y="118" width="480" height="16"/>
  <rect class="barFill" x="60" y="118" height="16"/>
</svg>
